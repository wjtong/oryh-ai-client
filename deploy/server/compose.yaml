# ORYH AI Client multi-user server, M1 (docs/33). From oryh-ai-client/:
#   docker compose -f deploy/server/compose.yaml --env-file .env up -d --build
# Local: open http://localhost:4300/ in Chrome (owners are served from <label>.localhost:4300).
# Production: set the public origin and owner domain, and put deploy/server/Caddyfile in front.
name: oryh-server
services:
  server:
    build:
      context: ../../..
      dockerfile: oryh-ai-client/deploy/server/Dockerfile
    ports:
      - "127.0.0.1:4300:4300"
    environment:
      ORYH_CLIENT_PUBLIC_ORIGIN: ${ORYH_CLIENT_PUBLIC_ORIGIN:-http://localhost:4300}
      ORYH_CLIENT_OWNER_DOMAIN: ${ORYH_CLIENT_OWNER_DOMAIN:-localhost:4300}
      ORYH_SERVER_ORIGIN: ${ORYH_SERVER_ORIGIN:-https://calwbiz-new.banff-tech.com}
      DEEPSEEK_API_KEY: ${ORYH_MODEL_API_KEY:?set ORYH_MODEL_API_KEY in .env}
      DEEPSEEK_BASE_URL: ${ORYH_MODEL_BASE_URL:-https://api.deepseek.com}
      # People signed in at once: one owner Host each, about 0.6 GB apiece.
      ORYH_HOST_CAPACITY: ${ORYH_HOST_CAPACITY:-10}
      ORYH_HOST_IDLE_MS: ${ORYH_HOST_IDLE_MS:-300000}
    volumes:
      - server-data:/data
    # Capacity × 0.6 GB + about 1 GB for the control process.
    mem_limit: ${ORYH_SERVER_MEMORY:-7g}
    healthcheck:
      # A signed-out visit to the public origin is sent to sign-in (303).
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:4300,path:'/',headers:{host:new URL(process.env.ORYH_CLIENT_PUBLIC_ORIGIN).host}},r=>process.exit(r.statusCode===303?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    init: true
    restart: unless-stopped
volumes:
  server-data:
